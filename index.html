<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Country Leaderboard</title>

<style>
  :root{
    --btn-radius:8px;
  }
  body {
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #74ebd5, #9face6);
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    margin: 0;
    padding: 20px;
  }

  h1 { margin-bottom: 10px; }

  button {
    padding: 10px 20px;
    margin: 10px;
    border: none;
    border-radius: var(--btn-radius);
    cursor: pointer;
    font-size: 16px;
    transition: 0.12s ease;
    background: #eee;
  }

  button:hover { transform: translateY(-2px); }

  #addPoint { background: #4CAF50; color: white; }
  #shopBtn { background: #2196F3; color: white; }

  /* Settings button in corner */
  #settingsBtn {
    position: fixed;
    top: 12px;
    right: 12px;
    z-index: 1200;
    background: #ff9800;
    color: white;
    border-radius: 10px;
    padding: 8px 12px;
  }

  /* SETTINGS MENU - fixed below settings button */
  #settingsMenu {
    display: none;
    position: fixed;
    top: 56px; /* just below settings button */
    right: 12px;
    width: 320px;
    background: rgba(255,255,255,0.97);
    padding: 14px;
    border-radius: 12px;
    border: 2px solid #444;
    box-shadow: 0 8px 24px rgba(0,0,0,0.15);
    z-index: 1100;
  }

  #settingsMenu h2 { margin-top: 0; margin-bottom: 8px; font-size:18px; }

  .gradientOption {
    padding: 10px;
    margin: 6px 0;
    border-radius: 8px;
    cursor: pointer;
    border: 2px solid transparent;
    color: #222;
    font-weight: 600;
    user-select: none;
  }
  .gradientOption:hover { border-color: #00000040; transform: translateY(-2px); }

  /* Music toggle outline states */
  #toggleMusic {
    padding: 8px 12px;
    border-radius: 8px;
    font-weight: 700;
    background: #fafafa;
    transition: box-shadow .12s, outline-color .12s;
    outline-offset: 3px;
    outline: 3px solid transparent;
  }
  #toggleMusic.on {
    outline-color: rgba(76,175,80,0.9); /* green */
    box-shadow: 0 6px 18px rgba(76,175,80,0.12);
    background: #f0fff4;
  }
  #toggleMusic.off {
    outline-color: rgba(244,67,54,0.9); /* red */
    box-shadow: 0 6px 18px rgba(244,67,54,0.12);
    background: #fff5f5;
  }

  /* Mobile friendly width for menus */
  @media (max-width:480px){
    #settingsMenu { right: 8px; left: 8px; width: auto; top: 60px; }
    #leaderboard { width: 90%; }
    #shop { width: 90%; }
  }

  #leaderboard {
    margin: 20px auto;
    padding: 10px;
    width: 300px;
    border: 2px solid #333;
    border-radius: 10px;
    background: white;
    text-align: left;
  }

  #leaderboard thead th { text-align: left; font-weight:700; padding:6px; }
  #leaderboard tbody td { padding:6px; border-top:1px solid #eee; }

  #shop {
    display: none;
    margin: 20px auto;
    padding: 15px;
    width: 300px;
    border: 2px solid #555;
    border-radius: 10px;
    background: #fafafa;
  }

  button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    transform: none !important;
  }

  #statusNote {
    font-size: 13px;
    color: #444;
    min-height: 18px;
  }

  /* Toast notifications (replaces blocking alert() popups) */
  #toastContainer {
    position: fixed;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 1300;
    display: flex;
    flex-direction: column;
    gap: 8px;
    align-items: center;
    pointer-events: none;
  }
  .toast {
    background: rgba(30,30,30,0.92);
    color: #fff;
    padding: 10px 16px;
    border-radius: 8px;
    font-size: 14px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.2);
    opacity: 0;
    transform: translateY(8px);
    transition: opacity .2s ease, transform .2s ease;
    max-width: 280px;
    text-align: center;
  }
  .toast.show { opacity: 1; transform: translateY(0); }
</style>
</head>

<body>

<h1>🌍Country Leaderboard🌍</h1>
<p id="country">Detecting your country...</p>
<p id="statusNote"></p>
<p>Upgrade Points: <span id="upgradePointsDisplay">0</span></p>

<button id="addPoint" disabled>+1 Point</button>
<button id="shopBtn">Shop 🛒</button>
<!-- Settings button fixed in the corner -->
<button id="settingsBtn">⚙️ Settings</button>

<table id="leaderboard" aria-label="Leaderboard">
  <thead>
    <tr><th>Country</th><th>Points</th></tr>
  </thead>
  <tbody></tbody>
</table>

<div id="shop">
  <h2>Shop</h2>
  <p>Upgrade Points: <span id="upgradePointsDisplay2">0</span></p>
  <button id="multiplierBtn" onclick="buyUpgrade('multiplier')">+1 Multiplier (Cost: 50)</button>
  <button id="autoClickerBtn" onclick="buyUpgrade('autoclick')">Auto-Clicker (Cost: 200)</button>
</div>

<!-- SETTINGS MENU (fixed) -->
<div id="settingsMenu" aria-hidden="true">
  <h2>Settings</h2>

  <p style="margin:6px 0 4px;"><b>Music:</b></p>
  <button id="toggleMusic" class="off" aria-pressed="false">Music: OFF</button>

  <p style="margin:12px 0 4px;"><b>Background:</b></p>
  <div class="gradientOption" onclick="changeBG(1)" style="background: linear-gradient(135deg, #74ebd5, #9face6);">
    Default
  </div>
  <div class="gradientOption" onclick="changeBG(2)" style="background: linear-gradient(135deg, #ff9a9e, #fecfef);">
    Pink
  </div>
  <div class="gradientOption" onclick="changeBG(3)" style="background: linear-gradient(135deg, #89f7fe, #66a6ff);">
    Ocean
  </div>
  <div class="gradientOption" onclick="changeBG(4)" style="background: linear-gradient(135deg, #f6d365, #fda085);">
    Sunset
  </div>
</div>

<div id="toastContainer"></div>

<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

<script>
/* ---------- Toast helper (replaces blocking alert() popups) ---------- */
const toastContainer = document.getElementById("toastContainer");
function showToast(message, duration = 2600) {
  const el = document.createElement("div");
  el.className = "toast";
  el.textContent = message;
  toastContainer.appendChild(el);
  requestAnimationFrame(() => el.classList.add("show"));
  setTimeout(() => {
    el.classList.remove("show");
    setTimeout(() => el.remove(), 250);
  }, duration);
}

/* ---------- Firebase init ----------
   Wrapped in try/catch: if the Firebase SDK fails to load (offline, ad
   blocker, CDN outage, etc.) the rest of the page — settings, music,
   background picker, and the local upgrade shop — must keep working.
   `dbReady` gates every call that touches the database. */
const firebaseConfig = {
  apiKey: "AIzaSyC_FeZlvtmTKvToG1lHn3moLSRdTmE-uzI",
  authDomain: "countryleaderboard.firebaseapp.com",
  databaseURL: "https://countryleaderboard-default-rtdb.firebaseio.com",
  projectId: "countryleaderboard",
  storageBucket: "countryleaderboard.appspot.com",
  messagingSenderId: "288815672414",
  appId: "1:288815672414:web:f6091a52d238c7080318cf"
};

let db = null;
let dbReady = false;

try {
  if (typeof firebase === "undefined") throw new Error("Firebase SDK did not load");
  firebase.initializeApp(firebaseConfig);
  db = firebase.database();
  dbReady = true;
} catch (err) {
  console.error("Firebase unavailable — leaderboard features disabled:", err);
  const lb = document.querySelector("#leaderboard tbody");
  if (lb) lb.innerHTML = `<tr><td colspan="2">Leaderboard unavailable right now</td></tr>`;
}

/* ---------- Country detection ---------- */
let userCountry = "";
const countryEl = document.getElementById("country");
const addPointBtn = document.getElementById("addPoint");
const statusNote = document.getElementById("statusNote");

function refreshAddPointAvailability() {
  addPointBtn.disabled = !(userCountry && dbReady);
}

function detectCountry() {
  countryEl.textContent = "Detecting your country...";
  statusNote.textContent = "";

  fetch("https://ipwho.is/")
    .then(async res => {
      if (!res.ok) throw new Error("Network response failed");
      return await res.json();
    })
    .then(data => {
      if (!data || data.success === false || !data.country) {
        throw new Error("Could not resolve country from response");
      }

      userCountry = data.country;
      const userContinent = data.continent || "Unknown";

      countryEl.textContent = "Your country: " + userCountry;
      refreshAddPointAvailability();

      if (dbReady) {
        db.ref("countryInfo/" + userCountry).set({ continent: userContinent })
          .catch(err => console.error("Could not write country info:", err));
      }
    })
    .catch(err => {
      console.error(err);
      userCountry = "";
      countryEl.textContent = "Could not detect country";
      statusNote.innerHTML = `<a href="#" id="retryDetect" style="color:#0645AD;">Tap to retry</a>`;
      document.getElementById("retryDetect").addEventListener("click", (e) => {
        e.preventDefault();
        detectCountry();
      });
      refreshAddPointAvailability();
    });
}

detectCountry();

/* ---------- Upgrade local system ----------
   Stored as one JSON blob instead of five separate keys — fewer localStorage
   round-trips and no risk of the fields drifting out of sync with each other. */
const PROGRESS_KEY = "leaderboardProgress";
const savedProgress = (() => {
  try {
    const existing = JSON.parse(localStorage.getItem(PROGRESS_KEY));
    if (existing) return existing;
  } catch {}

  // One-time migration from the old per-field keys, so returning players
  // don't lose their saved progress.
  const legacy = {
    upgradePoints: parseInt(localStorage.getItem("upgradePoints")) || 0,
    clickMultiplier: parseInt(localStorage.getItem("clickMultiplier")) || 1,
    autoClickers: parseInt(localStorage.getItem("autoClickers")) || 0,
    multiplierCost: parseInt(localStorage.getItem("multiplierCost")) || 50,
    autoClickerCost: parseInt(localStorage.getItem("autoClickerCost")) || 200
  };
  ["upgradePoints", "clickMultiplier", "autoClickers", "multiplierCost", "autoClickerCost"]
    .forEach(k => localStorage.removeItem(k));
  return legacy;
})();

let upgradePoints = savedProgress.upgradePoints || 0;
let clickMultiplier = savedProgress.clickMultiplier || 1;
let autoClickers = savedProgress.autoClickers || 0;
let multiplierCost = savedProgress.multiplierCost || 50;
let autoClickerCost = savedProgress.autoClickerCost || 200;

function saveUpgrades() {
  localStorage.setItem(PROGRESS_KEY, JSON.stringify({
    upgradePoints, clickMultiplier, autoClickers, multiplierCost, autoClickerCost
  }));
}

function updateUpgradeDisplay() {
  document.getElementById("upgradePointsDisplay").textContent = upgradePoints;
  document.getElementById("upgradePointsDisplay2").textContent = upgradePoints;
  document.getElementById("multiplierBtn").textContent = `+1 Multiplier (Cost: ${multiplierCost})`;
  document.getElementById("autoClickerBtn").textContent = `Auto-Clicker (Cost: ${autoClickerCost})`;
}
updateUpgradeDisplay();

function buyUpgrade(type) {
  if (type === "multiplier" && upgradePoints >= multiplierCost) {
    upgradePoints -= multiplierCost;
    clickMultiplier++;
    multiplierCost = Math.floor(multiplierCost * 1.5);
    showToast(`Multiplier upgraded! Now x${clickMultiplier}`);
  } else if (type === "autoclick" && upgradePoints >= autoClickerCost) {
    upgradePoints -= autoClickerCost;
    autoClickers++;
    autoClickerCost = Math.floor(autoClickerCost * 1.5);
    showToast(`Bought Auto-Clicker! (${autoClickers} total)`);
  } else {
    showToast("Not enough points!");
  }
  saveUpgrades();
  updateUpgradeDisplay();
}

/* ---------- Auto-clickers ---------- */
setInterval(() => {
  if (dbReady && autoClickers > 0 && userCountry) {
    const ref = db.ref("countries/" + userCountry);
    ref.transaction(current => (current || 0) + autoClickers * clickMultiplier);

    if (Math.random() < 0.05 * autoClickers) {
      upgradePoints += clickMultiplier;
      saveUpgrades();
      updateUpgradeDisplay();
    }
  }
}, 1000);

/* ---------- Click handler ---------- */
addPointBtn.addEventListener("click", () => {
  if (!dbReady || !userCountry) return;
  const ref = db.ref("countries/" + userCountry);
  ref.transaction(current => (current || 0) + (1 * clickMultiplier));

  if (Math.random() < 0.15) {
    upgradePoints += clickMultiplier;
    updateUpgradeDisplay();
    saveUpgrades();
  }
});

/* ---------- Leaderboard render ---------- */
const leaderboardBody = document.querySelector("#leaderboard tbody");
if (dbReady) {
  db.ref("countries").on("value", snapshot => {
    leaderboardBody.innerHTML = "";
    const data = snapshot.val() || {};
    const sorted = Object.entries(data).sort((a, b) => b[1] - a[1]);
    if (sorted.length === 0) {
      leaderboardBody.innerHTML = `<tr><td colspan="2">No scores yet</td></tr>`;
      return;
    }
    sorted.forEach(([country, points]) => {
      const row = document.createElement("tr");
      row.innerHTML = `<td>${country}</td><td>${points}</td>`;
      leaderboardBody.appendChild(row);
    });
  }, err => {
    console.error("Leaderboard read failed:", err);
    leaderboardBody.innerHTML = `<tr><td colspan="2">Leaderboard unavailable right now</td></tr>`;
  });
}

/* ---------- Shop toggle ---------- */
document.getElementById("shopBtn").addEventListener("click", () => {
  const shop = document.getElementById("shop");
  shop.style.display = (shop.style.display === "none" || shop.style.display === "") ? "block" : "none";
});

/* ---------- SETTINGS & MUSIC ---------- */

/*
 * Use your GitHub raw file URL here:
 * Format: https://raw.githubusercontent.com/<user>/<repo>/<branch>/<path>
 * I set a sensible default for your repo (assumes music.mp3 at root on main)
 */
const defaultMusicURL = "https://raw.githubusercontent.com/savvas767/Detector/main/good-night-lofi-cozy-chill-music-160166.mp3";

/* create audio element */
let music = new Audio();
music.src = localStorage.getItem("musicURL") || defaultMusicURL;
music.loop = true;
music.preload = "auto";

let musicFileBroken = false;
music.addEventListener("error", () => {
  musicFileBroken = true;
  console.error("Music file failed to load:", music.src);
});
music.addEventListener("loadeddata", () => { musicFileBroken = false; });

/* state */
let musicEnabled = localStorage.getItem("musicEnabled");
if (musicEnabled === null) {
  musicEnabled = true; // default ON
  localStorage.setItem("musicEnabled", true);
} else {
  musicEnabled = (musicEnabled === "true");
}
let currentBG = localStorage.getItem("backgroundID") || "1";

/* UI elems */
const toggleMusicBtn = document.getElementById("toggleMusic");
const settingsMenu = document.getElementById("settingsMenu");
const settingsBtn = document.getElementById("settingsBtn");

/* backgrounds */
const backgrounds = {
  1: "linear-gradient(135deg, #74ebd5, #9face6)",
  2: "linear-gradient(135deg, #ff9a9e, #fecfef)",
  3: "linear-gradient(135deg, #89f7fe, #66a6ff)",
  4: "linear-gradient(135deg, #f6d365, #fda085)"
};

function applyBackground(id){
  const pick = backgrounds[id] || backgrounds[1];
  document.body.style.background = pick;
  localStorage.setItem("backgroundID", id);
  currentBG = id;
}

/* initialize UI state (do not force play - may be blocked) */
applyBackground(currentBG);
setMusicButtonUI();

/* try to auto-play only if musicEnabled, but catch errors and keep UI in sync */
if (musicEnabled) {
  music.play().catch(err => {
    // Autoplay blocked — mark music as disabled until user clicks toggle
    musicEnabled = false;
    localStorage.setItem("musicEnabled", "false");
    setMusicButtonUI();
  });
}

/* helper to update toggle button look */
function setMusicButtonUI(){
  toggleMusicBtn.textContent = `Music: ${musicEnabled ? "ON" : "OFF"}`;
  toggleMusicBtn.classList.toggle("on", musicEnabled);
  toggleMusicBtn.classList.toggle("off", !musicEnabled);
  toggleMusicBtn.setAttribute("aria-pressed", String(musicEnabled));
}

/* change background from menu */
function changeBG(id){
  applyBackground(String(id));
}

/* toggle music on user click */
toggleMusicBtn.addEventListener("click", async () => {
  musicEnabled = !musicEnabled;
  localStorage.setItem("musicEnabled", musicEnabled ? "true" : "false");

  if (musicEnabled) {
    try {
      await music.play(); // a click is a user gesture, so this should succeed
    } catch (e) {
      musicEnabled = false;
      localStorage.setItem("musicEnabled", "false");
      if (musicFileBroken) {
        showToast("Music file couldn't be loaded. Double-click this button to set a working URL.", 4000);
      } else {
        showToast("Playback was blocked. Tap the button again to start music.");
      }
    }
  } else {
    music.pause();
    music.currentTime = 0;
  }
  setMusicButtonUI();
});

/* Toggle settings menu visibility (button in corner) */
settingsBtn.addEventListener("click", () => {
  const isHidden = (settingsMenu.style.display === "none" || settingsMenu.style.display === "");
  settingsMenu.style.display = isHidden ? "block" : "none";
  settingsMenu.setAttribute("aria-hidden", !isHidden ? "true" : "false");
});

/* Close settings if user clicks outside it */
document.addEventListener("click", (e) => {
  const target = e.target;
  if (!settingsMenu.contains(target) && !settingsBtn.contains(target)) {
    // only hide if it was open
    if (settingsMenu.style.display === "block") {
      settingsMenu.style.display = "none";
      settingsMenu.setAttribute("aria-hidden", "true");
    }
  }
});

/* Double-click the music button to set a custom track URL */
toggleMusicBtn.addEventListener("dblclick", () => {
  const newURL = prompt("Enter the direct URL to your music file (mp3):", localStorage.getItem("musicURL") || defaultMusicURL);
  if (newURL && newURL.trim()) {
    localStorage.setItem("musicURL", newURL.trim());
    music.src = newURL.trim();
    if (musicEnabled) {
      music.play().catch(() => {
        showToast("Couldn't play the new track — tap the Music button to try again.");
      });
    }
  }
});

/* Helpful: show a small hint in console about the correct raw URL format */
console.info("If your GitHub-hosted music doesn't play, make sure the raw URL looks like:\nhttps://raw.githubusercontent.com/<user>/<repo>/<branch>/<path>\nExample used:", defaultMusicURL);
</script>
</body>
</html>
